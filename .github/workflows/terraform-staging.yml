name: Terraform - STAGING

on:
  push:
    branches: ["main"]
    paths:
      - "terraform/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      action:
        description: "plan or apply"
        required: true
        default: "plan"
        type: choice
        options: [plan, apply]

permissions:
  contents: read
  id-token: write

jobs:
  # PLAN auto (PR + push main)
  plan:
    if: ${{ github.event_name != 'workflow_dispatch' }}
    uses: ./.github/workflows/terraform-reusable.yml
    with:
      environment: staging
      action: plan

    # ✅ Mapping explicite (comme DEV)
    secrets:
      GCP_WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER_STAGING }}
      GCP_WIF_SA: ${{ secrets.GCP_WIF_SA_STAGING }}

  # Manuel : plan/apply
  manual:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/terraform-reusable.yml
    with:
      environment: staging
      action: ${{ inputs.action }}

    # ✅ Mapping explicite (comme DEV)
    secrets:
      GCP_WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER_STAGING }}
      GCP_WIF_SA: ${{ secrets.GCP_WIF_SA_STAGING }}