name: Terraform-dev

on:
  push:
    branches: ["main"]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-dev.yml"
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-dev.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  terraform-plan-dev:
    environment: dev
    runs-on: ubuntu-latest

    # ✅ Job-level env : valeurs disponibles partout (bash + yaml expressions)
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID_DEV }}
      TF_BUCKET: ${{ vars.TF_STATE_BUCKET_DEV }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 0) Resolve inputs (DEV) + fail fast
      - name: Resolve DEV inputs
        shell: bash
        run: |
          set -euo pipefail

          echo "event_name=${GITHUB_EVENT_NAME}"
          echo "ref=${GITHUB_REF}"
          echo "actor=${GITHUB_ACTOR}"
          echo "repo=${GITHUB_REPOSITORY}"

          # Vars (environment variables, non-sensitive)
          : "${{ vars.GCP_PROJECT_ID_DEV }}"
          : "${{ vars.TF_STATE_BUCKET_DEV }}"
          echo "Vars OK"

          # Secrets (sensitive)
          : "${{ secrets.GCP_WIF_PROVIDER_DEV }}"
          : "${{ secrets.GCP_WIF_SA_DEV }}"
          echo "Secrets OK (masked)"

          echo "PROJECT_ID=${PROJECT_ID}"
          echo "TF_BUCKET=${TF_BUCKET}"

      # 1) Auth via WIF (ADC)
      - name: Authenticate to Google Cloud (WIF)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER_DEV }}
          service_account: ${{ secrets.GCP_WIF_SA_DEV }}
          create_credentials_file: true
          export_environment_variables: true

      # 2) gcloud setup (⚠️ ici il faut une expression GitHub, pas $PROJECT_ID)
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      # 2bis) Force project context everywhere
      - name: Force project env (fail fast)
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${PROJECT_ID}" ]]; then
            echo "❌ PROJECT_ID is empty (vars.GCP_PROJECT_ID_DEV)"
            exit 1
          fi
          if [[ -z "${TF_BUCKET}" ]]; then
            echo "❌ TF_BUCKET is empty (vars.TF_STATE_BUCKET_DEV)"
            exit 1
          fi

          echo "CLOUDSDK_CORE_PROJECT=${PROJECT_ID}" >> "$GITHUB_ENV"
          echo "GOOGLE_CLOUD_PROJECT=${PROJECT_ID}"  >> "$GITHUB_ENV"
          echo "GOOGLE_PROJECT=${PROJECT_ID}"        >> "$GITHUB_ENV"
          echo "GCP_PROJECT=${PROJECT_ID}"           >> "$GITHUB_ENV"

      # 3) Verify identity (debug - best effort)
      - name: Verify identity (debug)
        shell: bash
        run: |
          set -uo pipefail

          echo "ADC file: ${GOOGLE_APPLICATION_CREDENTIALS:-<empty>}"
          echo "== gcloud version =="
          gcloud version || true

          echo "== gcloud config =="
          gcloud config list || true

          echo "== gcloud auth list =="
          gcloud auth list || true

          echo "== project describe =="
          gcloud projects describe "${PROJECT_ID}" >/dev/null && echo "OK: can read project" || true

      # 4) Impersonation test (debug only)
      - name: Impersonation test (debug)
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          SA="${{ secrets.GCP_WIF_SA_DEV }}"
          echo "Trying impersonation (best effort): ${SA}"
          gcloud auth print-access-token --impersonate-service-account="${SA}" >/dev/null 2>/tmp/imp_err.txt || true
          if [ -s /tmp/imp_err.txt ]; then
            echo "⚠️ Impersonation failed (debug only):"
            cat /tmp/imp_err.txt || true
          else
            echo "OK: impersonation worked"
          fi

      # 5) API probes
      - name: API probes (BigQuery / Secret Manager / Dataplex / Dataform)
        shell: bash
        run: |
          set -euo pipefail

          echo "== Secret Manager probe =="
          gcloud secrets list --project "${PROJECT_ID}" --limit=5 >/dev/null
          echo "OK: secrets list"

          echo "== BigQuery probe =="
          bq --project_id="${PROJECT_ID}" ls >/dev/null
          echo "OK: bq ls"

          echo "== Dataplex probe (best effort) =="
          gcloud dataplex lakes list --project "${PROJECT_ID}" --location="europe-west1" --limit=5 >/dev/null 2>/tmp/dp_err.txt || true
          if [ -s /tmp/dp_err.txt ]; then
            echo "⚠️ Dataplex probe warning (ignored):"
            cat /tmp/dp_err.txt || true
          else
            echo "OK: dataplex lakes list"
          fi

      # 6) Backend sanity checks
      - name: Backend sanity (GCS state)
        shell: bash
        run: |
          set -euo pipefail
          echo "== bucket ls =="
          gcloud storage ls "gs://${TF_BUCKET}/" >/dev/null && echo "OK: bucket reachable"

          echo "== state objects (foundation/dev, lakehouse/dev) =="
          gcloud storage ls "gs://${TF_BUCKET}/foundation/dev/" --recursive || true
          gcloud storage ls "gs://${TF_BUCKET}/lakehouse/dev/" --recursive || true

      # 7) Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      # =========================
      # FOUNDATION ROOT
      # =========================
      - name: Terraform fmt (foundation)
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=terraform/foundation fmt -check -recursive

      - name: Terraform init (foundation/dev backend)
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=terraform/foundation init -reconfigure \
            -backend-config="bucket=${TF_BUCKET}" \
            -backend-config="prefix=foundation/dev"

      - name: Terraform validate (foundation)
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=terraform/foundation validate

      - name: Terraform plan (foundation/dev)
        shell: bash
        env:
          CLOUDSDK_CORE_PROJECT: ${{ env.PROJECT_ID }}
          GOOGLE_CLOUD_PROJECT: ${{ env.PROJECT_ID }}
        run: |
          set -euo pipefail
          terraform -chdir=terraform/foundation plan \
            -compact-warnings \
            -var-file=envs/dev/terraform.tfvars

      # =========================
      # LAKEHOUSE ROOT
      # =========================
      - name: Terraform fmt (lakehouse)
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=terraform/lakehouse fmt -check -recursive

      - name: Terraform init (lakehouse/dev backend)
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=terraform/lakehouse init -reconfigure \
            -backend-config="bucket=${TF_BUCKET}" \
            -backend-config="prefix=lakehouse/dev"

      - name: Terraform validate (lakehouse)
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=terraform/lakehouse validate

      - name: Terraform plan (lakehouse/dev)
        shell: bash
        env:
          CLOUDSDK_CORE_PROJECT: ${{ env.PROJECT_ID }}
          GOOGLE_CLOUD_PROJECT: ${{ env.PROJECT_ID }}
        run: |
          set -euo pipefail
          terraform -chdir=terraform/lakehouse plan \
            -compact-warnings \
            -var-file=envs/dev/terraform.tfvars