name: Terraform - DEV

on:
  push:
    branches: ["main"]
    paths:
      - "terraform/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      action:
        description: "plan or apply"
        required: true
        default: "plan"
        type: choice
        options: [plan, apply]

permissions:
  contents: read
  id-token: write

jobs:
  # Sur push main + PR : on fait un PLAN
  plan:
    if: ${{ github.event_name != 'workflow_dispatch' }}
    uses: ./.github/workflows/terraform-reusable.yml
    with:
      environment: dev
      action: plan
    secrets: inherit  # ✅ ENTERPRISE: récupère les secrets de l'Environment dev

  # Manuel : plan/apply
  manual:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/terraform-reusable.yml
    with:
      environment: dev
      action: ${{ inputs.action }}
    secrets: inherit