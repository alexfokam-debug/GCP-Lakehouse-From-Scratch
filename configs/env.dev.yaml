# =============================================================================
# ENV CONFIG - DEV
# -----------------------------------------------------------------------------
# Fichier de configuration central pour l'environnement DEV.
#
# OBJECTIF
# - Centraliser tous les paramètres d'infrastructure et de pipeline
# - Éviter les valeurs en dur dans les scripts Python
# - Préparer l'industrialisation (CI/CD data, Composer, multi-env)
#
# BONNES PRATIQUES
# - 1 seule source de vérité par environnement
# - Les scripts lisent ce fichier au lieu de hardcoder les chemins
# - Même structure réutilisable plus tard pour staging / prod
# =============================================================================

# =============================================================================
# 1) CONTEXTE GCP GLOBAL
# =============================================================================
project_id: "lakehouse-486419"
region: "europe-west1"
env: "dev"

# =============================================================================
# 2) BUCKETS GCS DU LAKEHOUSE
# -----------------------------------------------------------------------------
# Tous les buckets utilisés par les pipelines data.
# =============================================================================
buckets:
  raw: "lakehouse-486419-raw-dev"
  curated: "lakehouse-486419-curated-dev"
  iceberg: "lakehouse-486419-iceberg-dev"
  scripts: "lakehouse-486419-scripts-dev"
  dataproc_temp: "lakehouse-486419-dataproc-temp-dev"

gcs:
  raw_bucket: "lakehouse-486419-raw-dev"
  curated_bucket: "lakehouse-486419-curated-dev"
  iceberg_bucket: "lakehouse-486419-iceberg-dev"
  scripts_bucket: "lakehouse-486419-scripts-dev"
  dataproc_temp_bucket: "lakehouse-486419-dataproc-temp-dev"

# =============================================================================
# 3) DATASETS BIGQUERY
# -----------------------------------------------------------------------------
# Datasets cibles du lakehouse pour exposition SQL / analytics.
# =============================================================================
datasets:
  raw_external: "raw_ext_dev"
  curated_external: "curated_ext_dev"
  curated: "curated_dev"
  curated_iceberg: "curated_iceberg_dev"
  enterprise: "enterprise_dev"
  analytics: "analytics_dev"
  tmp: "tmp_lakehouse_dev"

# =============================================================================
# 4) CONFIG ICEBERG
# -----------------------------------------------------------------------------
# Configuration liée au futur usage de tables Iceberg.
# Pour le moment, le pipeline ARCO va surtout viser Parquet prepared.
# NYC Taxi servira plus tard pour la vraie démonstration Iceberg.
# =============================================================================
iceberg:
  warehouse_uri: "gs://lakehouse-486419-iceberg-dev/warehouse"
  catalog_name: "lakehouse"
  db: "curated_iceberg_dev"
  table: "sample_ext"
  raw_table: "raw_ext_dev.sample_ext"

# =============================================================================
# 5) CONFIG DATAPROC
# -----------------------------------------------------------------------------
# Paramètres d'exécution Dataproc Serverless / Spark.
# =============================================================================
dataproc:
  runtime_version: "2.2"
  service_account: "sa-dataproc-dev@lakehouse-486419.iam.gserviceaccount.com"
  scala_binary: "2.13"

  # Package Iceberg pour Spark 3.5 / Scala 2.13
  iceberg_package: "org.apache.iceberg:iceberg-spark-runtime-3.5_2.13:1.6.1"

  # Bucket temporaire utilisé par Dataproc / Spark
  temp_bucket: "lakehouse-486419-dataproc-temp-dev"

  # Packages Python qu'on pourra injecter sur certains jobs Dataproc
  pip_packages:
    - xarray
    - cfgrib
    - google-cloud-storage
    - pandas
    - pyarrow

  # Réglages Spark de base pour DEV
  spark:
    executor_memory: "4g"
    executor_cores: 4

# =============================================================================
# 6) CONFIG DATAFORM
# -----------------------------------------------------------------------------
# Repo et workflow Dataform côté GCP.
# =============================================================================
dataform:
  repo: "lakehouse-dev-dataform"
  workflow: "wf-dev-on-demand"

# =============================================================================
# 7) PIPELINES DATA
# -----------------------------------------------------------------------------
# Chaque pipeline a sa propre section avec :
# - domaine
# - dataset
# - source
# - chemins landing/raw/prepared
# =============================================================================
pipelines:
  arco_era5:
    domain: "weather"
    dataset: "arco_era5"

    # Source publique GCS
    source_bucket: "gcp-public-data-arco-era5"
    source_objects:
      - "raw/ERA5GRIB/HRES/Daily/1940/19400101_hres_dve.grb2"
      - "raw/ERA5GRIB/HRES/Daily/1940/19400101_hres_o3q.grb2"
      - "raw/ERA5GRIB/HRES/Daily/1940/19400101_hres_qrqs.grb2"

    # Préfixes lakehouse
    landing_prefix: "domain=weather/dataset=arco_era5/landing/"
    raw_prefix: "domain=weather/dataset=arco_era5/raw/"
    prepared_prefix: "domain=weather/dataset=arco_era5/prepared/"

    # Fichier utilisé pour les premiers tests Dataproc / inspection
    sample_file: "19400101_hres_dve.grb2"

  nyc_taxi:
    domain: "mobility"
    dataset: "nyc_taxi"

    # À compléter plus tard pour la deuxième partie du projet
    landing_prefix: "domain=mobility/dataset=nyc_taxi/landing/"
    raw_prefix: "domain=mobility/dataset=nyc_taxi/raw/"
    prepared_prefix: "domain=mobility/dataset=nyc_taxi/prepared/"

# =============================================================================
# 8) COMPATIBILITÉ / LEGACY
# -----------------------------------------------------------------------------
# Section optionnelle pour scripts plus anciens si besoin de transition.
# Tu pourras la supprimer plus tard quand tout sera refactoré.
# =============================================================================
legacy:
  gcs:
    raw_bucket: "lakehouse-486419-raw-dev"
